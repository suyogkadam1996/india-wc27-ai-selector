name: Monthly Data Refresh

# WHEN this runs:
#   1. Automatically, on the 1st of every month at 03:00 UTC
#   2. Manually, anytime, via the "Run workflow" button on the Actions tab
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

# Without this, GitHub only lets the automated run READ the repo, not
# save changes back to it -- this is what caused the first run to fail.
permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full data pipeline
        run: python src/run_pipeline.py

      - name: Commit and push updated results (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet data/reference/*.csv
          git diff --staged --quiet || git commit -m "Automated monthly data refresh"
          git push
